services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: empreinte
      POSTGRES_USER: empreinte
      POSTGRES_PASSWORD: empreinte
    ports:
      - '${RESOURCE_POSTGRES_PORT:-54329}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U empreinte -d empreinte']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - resource-postgres-data:/var/lib/postgresql/data

volumes:
  resource-postgres-data:
