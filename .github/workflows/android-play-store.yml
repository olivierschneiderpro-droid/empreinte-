# Compile l'app Android d'Empreinte (Trusted Web Activity sur lavérité.tech/app) et la remet
# en fichier .aab à envoyer sur le Google Play Console. À lancer à la main : onglet Actions →
# « App Android (Play Store) » → Run workflow.
#
# Secrets du dépôt à créer une fois (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64   la clé d'envoi (fichier .keystore encodé en base64)
#   ANDROID_KEYSTORE_PASSWORD son mot de passe
name: App Android (Play Store)

on:
  # Sur une PR qui touche l'app Android : on vérifie seulement que tout compile.
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-play-store.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version affichée (ex. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer la clé d'envoi
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLE" ]; then
            echo "$CLE" | base64 -d > "$RUNNER_TEMP/empreinte-upload.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/empreinte-upload.keystore" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_BASE64 manque (Settings → Secrets and variables → Actions)."
            exit 1
          else
            echo "::notice::Pas de clé : compilation de vérification, non signée."
          fi

      - name: Compiler l'app (.aab et .apk)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: empreinte
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.version || '1.0.0' }}\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Remettre les fichiers
        uses: actions/upload-artifact@v4
        with:
          name: empreinte-android-${{ inputs.version || 'verification' }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
